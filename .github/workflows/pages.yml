name: Deploy designer to GitHub Pages

# The designer is a static site that runs threedstep in the browser under
# Pyodide, so publishing it needs no server: build the Python payload it
# fetches at startup, then upload the folder with the viewer runtime beside it.

on:
  push:
    branches: [master]
    paths:
      - "src/threedstep/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Pyodide payload
        run: PYTHONPATH=src python -m threedstep.payload

      - name: Stage the site
        run: |
          mkdir -p _site
          cp src/threedstep/designer/index.html _site/
          cp src/threedstep/designer/threedstep.zip _site/
          for dir in css js vendor; do
            if [ -d "src/threedstep/designer/$dir" ]; then
              cp -r "src/threedstep/designer/$dir" "_site/$dir"
            fi
          done
          cp -r src/threedstep/viewer _site/viewer
          find _site -name __pycache__ -type d -prune -exec rm -rf {} +
          echo "3dstep.isiks.tech" > _site/CNAME

      - name: Check the site landed
        run: |
          test -s _site/index.html
          test -s _site/threedstep.zip
          test -s _site/viewer/viewer.js
          test -s _site/viewer/viewer.css
          test "$(cat _site/CNAME)" = "3dstep.isiks.tech"
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("_site/threedstep.zip").namelist()
          assert "bridge.py" in names, "payload is missing the bridge module"
          assert "threedstep/__init__.py" in names, "payload is missing the threedstep package"
          assert any(n.endswith(".toml") for n in names), "payload has no theme data"
          assert any(n.endswith(".js") for n in names), "payload has no viewer runtime"
          assert "threedstep/viewer/viewer.js" in names, "payload is missing the viewer"
          stray = [n for n in names if n != "bridge.py" and not n.startswith("threedstep/")]
          assert not stray, f"payload has entries outside threedstep/: {stray}"
          print(f"payload ok: {len(names)} entries")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
